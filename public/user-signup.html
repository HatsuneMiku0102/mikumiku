<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create account</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <h1>Create account</h1>

    <form id="signup-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>

      <button class="btn" id="signup-btn" type="submit">Create account</button>
    </form>

    <p class="muted">
      Already have an account?
      <a href="/user/auth">Log in</a>
    </p>

    <div id="error" class="msg error" style="display:none"></div>
    <div id="ok" class="msg ok" style="display:none"></div>
  </div>

  <script src="/user-signup.js"></script>
</body>
</html>
