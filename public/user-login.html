<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{font-family:system-ui;background:#0b1220;color:#e7eefc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{width:100%;max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    h1{margin:0 0 14px;font-size:20px}
    label{display:block;font-size:13px;opacity:.9;margin:12px 0 6px}
    input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:#e7eefc;outline:none}
    input:focus{border-color:rgba(140,200,255,.6)}
    button{width:100%;margin-top:14px;padding:10px 12px;border:0;border-radius:12px;background:#39c5bb;color:#08121b;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:12px;display:none}
    .msg.err{background:rgba(255,77,77,.15);border:1px solid rgba(255,77,77,.35)}
    .msg.ok{background:rgba(38,208,124,.15);border:1px solid rgba(38,208,124,.35)}
    .row{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px}
    a{color:#8cc8ff;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <h1>Log in</h1>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="login-button" type="submit">Log in</button>

      <div id="error-message" class="msg err"></div>
      <div id="success-message" class="msg ok"></div>

      <div class="row">
        <span>No account?</span>
        <a href="/user/signup">Create one</a>
      </div>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
