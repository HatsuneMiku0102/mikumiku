<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MikuMiku • Profile</title>
  <link rel="stylesheet" href="/image-host/styles.css" />
</head>
<body class="ui" data-page="profile">
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-stars"></div>
    <div class="bg-glow a"></div>
    <div class="bg-glow b"></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div class="brand-text">
          <div class="brand-title">MikuMiku</div>
          <div class="brand-sub">User Panel</div>
        </div>
      </div>

      <div class="profile-mini">
        <div class="avatar">
          <img id="miniAvatar" alt="avatar" />
          <div id="avatarFallback" class="avatar-fallback hidden">U</div>
        </div>
        <div class="profile-mini-meta">
          <div id="miniUsername" class="profile-mini-name">Loading…</div>
          <div class="profile-mini-sub muted">Profile</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" href="/image-host/" data-nav="dashboard"><span class="dot"></span>Dashboard</a>
        <a class="nav-item" href="/image-host/upload" data-nav="upload"><span class="dot"></span>Upload</a>
        <a class="nav-item" href="/image-host/fetch" data-nav="fetch"><span class="dot"></span>Fetch URL</a>
        <a class="nav-item" href="/image-host/profile" data-nav="profile"><span class="dot"></span>Profile</a>
      </nav>

      <div class="side-card">
        <div class="side-row">
          <div class="side-label">API</div>
          <div class="side-value mono" id="apiLabel"></div>
        </div>

        <div class="side-row">
          <button id="logoutBtn" class="btn danger" type="button">Logout</button>
        </div>
      </div>

      <div class="side-foot">
        <div class="muted">Change avatar, username, password</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title">
          <h1>Profile</h1>
          <p class="sub">Manage your account.</p>
        </div>

        <div class="stats">
          <div class="pill">
            <div class="pill-k">Status</div>
            <div id="status" class="status idle">Idle</div>
          </div>
        </div>
      </header>

      <section class="grid one">
        <div class="card">
          <div class="card-head">
            <h2>Profile</h2>
            <div class="hint">Username • password • avatar</div>
          </div>

          <div class="profile-grid">
            <div class="profile-avatar">
              <div class="avatar big">
                <img id="profileAvatarImg" alt="avatar" />
                <div id="profileAvatarFallback" class="avatar-fallback hidden">U</div>
              </div>

              <div class="row" style="justify-content:center;">
                <label class="btn ghost" style="cursor:pointer;">
                  <input id="avatarFile" type="file" accept="image/*" style="display:none;" />
                  Upload photo
                </label>
                <button id="removeAvatarBtn" class="btn danger" type="button">Remove</button>
              </div>
            </div>

            <div class="profile-forms">
              <form id="usernameForm" class="stack">
                <div class="field">
                  <div class="label">Username</div>
                  <div class="control">
                    <input id="newUsername" class="input" autocomplete="username" />
                    <button class="btn primary" type="submit">Save</button>
                  </div>
                </div>
                <div id="usernameMsg" class="msg hidden"></div>
              </form>

              <form id="passwordForm" class="stack">
                <div class="field">
                  <div class="label">Current password</div>
                  <input id="currentPassword" class="input" type="password" autocomplete="current-password" />
                </div>

                <div class="field">
                  <div class="label">New password</div>
                  <input id="newPassword" class="input" type="password" autocomplete="new-password" />
                </div>

                <div class="row">
                  <button class="btn primary" type="submit">Change password</button>
                  <button class="btn ghost" id="togglePwBtn" type="button">Show</button>
                </div>

                <div id="passwordMsg" class="msg hidden"></div>
              </form>

              <pre id="errorBox" class="error hidden"></pre>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/image-host/app.js"></script>
</body>
</html>
