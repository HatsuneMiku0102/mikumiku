<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MikuMiku | Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.68);
      --line: rgba(255,255,255,0.10);
      --accent: #39c5bb;
      --danger: #ff4d4d;
      --warn: #ffcc00;
      --ok: #26d07c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(1200px 700px at 25% 0%, rgba(57,197,187,0.20), transparent 55%),
                  radial-gradient(900px 600px at 100% 30%, rgba(80,120,255,0.20), transparent 60%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 16px 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(57,197,187,0.14);
    }
    .brand h1 {
      font-size: 16px;
      margin: 0;
      letter-spacing: 0.3px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.16); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: rgba(57,197,187,0.14); border-color: rgba(57,197,187,0.32); }
    .btn.primary:hover { background: rgba(57,197,187,0.20); }
    .btn.danger { background: rgba(255,77,77,0.14); border-color: rgba(255,77,77,0.32); }
    .btn.danger:hover { background: rgba(255,77,77,0.20); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .pill label { color: var(--muted); font-size: 13px; }
    .switch {
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .switch input { display: none; }
    .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.86);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .switch input:checked + .knob {
      transform: translateX(20px);
      background: rgba(57,197,187,0.95);
    }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .card .big {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 2px;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
      display: grid;
      gap: 10px;
      max-height: 310px;
      overflow: auto;
    }
    .item {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .itemTop {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .itemTitle { font-weight: 700; font-size: 13px; }
    .itemMeta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .itemBtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .chartWrap { height: 280px; }
    canvas { width: 100% !important; height: 100% !important; }

    .timeline {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      min-height: 50px;
    }
    .tblock {
      width: 6px;
      height: 22px;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      opacity: 0.95;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .tblock:hover { transform: translateY(-2px) scale(1.15); opacity: 1; z-index: 2; }
    .tip {
      position: absolute;
      bottom: 140%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      white-space: pre;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      min-width: 180px;
    }
    .tblock:hover .tip { opacity: 1; }

    .fieldGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 680px) {
      .fieldGrid { grid-template-columns: 1fr; }
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      outline: none;
    }
    .textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    .inline {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .copyRow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .note {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <h1>MikuMiku Admin Dashboard</h1>
      </div>
      <div class="actions">
        <div class="pill">
          <label>LFG Command</label>
          <div class="switch">
            <input type="checkbox" id="lfgToggle">
            <div class="knob"></div>
          </div>
        </div>
        <button class="btn danger" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <div>
            <h2>Active Users</h2>
            <div class="big" id="active-users-count">Loading...</div>
            <div class="muted">Real-time connections and types</div>
          </div>
        </div>

        <ul id="active-ip-list" class="list"></ul>

        <div style="margin-top:16px;">
          <h2>Minute-by-minute Status</h2>
          <div class="timeline" id="minuteTimeline"></div>
        </div>
      </div>

      <div class="card">
        <h2>Visitors by Country</h2>
        <div class="chartWrap">
          <canvas id="locationChart"></canvas>
        </div>

        <div style="margin-top:16px;">
          <h2>Image Host API Keys</h2>

          <div class="fieldGrid">
            <div class="field">
              <label for="keyName">Name</label>
              <input class="input" id="keyName" placeholder="friend1 / sharex / node-server">
            </div>
            <div class="field">
              <label for="keyRate">Rate per minute</label>
              <input class="input" id="keyRate" type="number" min="1" max="600" value="30">
            </div>
            <div class="field">
              <label for="keyScopes">Scopes</label>
              <select class="select" id="keyScopes">
                <option value="upload,fetch">upload,fetch</option>
                <option value="upload">upload only</option>
                <option value="fetch">fetch only</option>
              </select>
            </div>
            <div class="field">
              <label for="keyNeverExpires">Never expires</label>
              <select class="select" id="keyNeverExpires">
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
          </div>

          <div class="inline" style="margin-top:10px;">
            <button class="btn primary" id="generateKeyBtn"><i class="fa-solid fa-key"></i> Generate Key</button>
            <div class="muted" id="keyStatus"></div>
          </div>

          <div style="margin-top:12px;">
            <div class="field">
              <label>Generated API key</label>
              <div class="copyRow">
                <input class="input" id="generatedKey" readonly placeholder="Click Generate Key">
                <button class="btn" data-copy="generatedKey"><i class="fa-regular fa-copy"></i> Copy</button>
              </div>
            </div>

            <div class="field" style="margin-top:10px;">
              <label>curl upload command</label>
              <div class="copyRow">
                <textarea class="textarea" id="curlUpload" readonly placeholder="Will appear after generating a key"></textarea>
                <button class="btn" data-copy="curlUpload"><i class="fa-regular fa-copy"></i> Copy</button>
              </div>
            </div>

            <div class="field" style="margin-top:10px;">
              <label>curl fetch command</label>
              <div class="copyRow">
                <textarea class="textarea" id="curlFetch" readonly placeholder="Will appear after generating a key"></textarea>
                <button class="btn" data-copy="curlFetch"><i class="fa-regular fa-copy"></i> Copy</button>
              </div>
            </div>

            <div class="note">
              This panel generates keys through your website server (authenticated), so the image-host admin secret never reaches the browser.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin-dashboard.js"></script>
</body>
</html>
